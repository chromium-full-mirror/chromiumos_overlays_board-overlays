SectionVerb {
	Value {
		FullySpecifiedUCM "1"
	}
	EnableSequence [
		cdev "hw:PCH"

		cset "name='Capture Switch' on"
		cset "name='Capture Volume' 39"
		cset "name='Mic Boost Volume' 2"
		cset "name='Internal Mic Boost Volume' 0"
		cset "name='Capture Source' 0"
	]
	DisableSequence [
	]
}

SectionDevice."Internal Mic".0 {
        Value {
                CapturePCM "hw:PCH,0"
        }
}

SectionDevice."Mic".0 {
	Value {
		JackDev "Mic Jack"
		CapturePCM "hw:PCH,0"
	}
	EnableSequence [
		cdev "hw:PCH"

		cset "name='Capture Source' 1"
	]
	DisableSequence [
		cdev "hw:PCH"

		cset "name='Capture Source' 0"
	]
}
