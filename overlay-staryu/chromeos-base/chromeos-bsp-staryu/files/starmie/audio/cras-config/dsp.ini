[output_source]
library=builtin
label=source
purpose=playback
disable=(not (equal? dsp_name "speaker_eq"))
output_0={src:0}
output_1={src:1}

[output_sink]
library=builtin
label=sink
purpose=playback
input_0={dst:0}
input_1={dst:1}

[drc]
library=builtin
label=drc
input_0={src:0}
input_1={src:1}
output_2={intermediate:0}
output_3={intermediate:1}
input_4=1         ; emphasis_disabled
input_5=0         ; f
input_6=1         ; enable
input_7=-24       ; threshold
input_8=30        ; knee
input_9=20        ; ratio
input_10=0.003     ; attack
input_11=0.25      ; release
input_12=0         ; boost
input_13=200       ; f
input_14=1         ; enable
input_15=-24       ; threshold
input_16=26        ; knee
input_17=20        ; ratio
input_18=0.003     ; attack
input_19=0.25      ; release
input_20=3         ; boost
input_21=2000      ; f
input_22=1         ; enable
input_23=-24       ; threshold
input_24=26        ; knee
input_25=20        ; ratio
input_26=0.003     ; attack
input_27=0.25      ; release
input_28=3         ; boost

[eq2]
library=builtin
label=eq2
input_0={intermediate:0}
input_1={intermediate:1}
output_2={dst:0}
output_3={dst:1}
input_4=6       ; peaking
input_5=800     ; freq
input_6=3.5     ; Q
input_7=-6.5    ; gain
input_8=6       ; peaking
input_9=900     ; freq
input_10=3.5     ; Q
input_11=-7      ; gain
