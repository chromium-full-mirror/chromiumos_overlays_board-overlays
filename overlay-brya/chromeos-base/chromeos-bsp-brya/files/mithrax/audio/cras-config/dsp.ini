input_20=4         ; boost
input_21=4000      ; f
input_22=1         ; enable
input_23=-20       ; threshold
input_24=30        ; knee
input_25=9         ; ratio
input_26=0.01      ; attack
input_27=0.25      ; release
input_28=3         ; boost

